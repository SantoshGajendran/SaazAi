<div class="pdf-canvas-wrapper" (mouseup)="onCanvasMouseUp($event)">
    <!-- Top Canvas Toolbar -->
    <div class="canvas-header">
        <div class="page-indicator">
            <button class="nav-btn" (click)="prevPage()" [disabled]="currentPage <= 1" title="Previous Page">◀</button>
            <span>Page {{ currentPage }} of {{ totalPages || 1 }}</span>
            <button class="nav-btn" (click)="nextPage()" [disabled]="currentPage >= totalPages" title="Next Page">▶</button>
        </div>
        <div class="zoom-controls">
            <button class="tool-btn" (click)="sync.zoomOut()" title="Zoom Out">−</button>
            <span class="zoom-text">{{ (zoomLevel * 100) | number:'1.0-0' }}%</span>
            <button class="tool-btn" (click)="sync.zoomIn()" title="Zoom In">+</button>
        </div>
    </div>

    <!-- Viewport Container -->
    <div class="canvas-viewport" #canvasContainer>
        <div class="page-container" [style.width.px]="viewportWidth" [style.height.px]="viewportHeight" [style.display]="isLoading || !pdfDoc ? 'none' : 'block'">
            <canvas #pdfCanvas class="pdf-page-canvas"></canvas>
            <div #textLayer class="text-layer" [style.width.px]="viewportWidth" [style.height.px]="viewportHeight"></div>
            <!-- Glowing Vector Overlay -->
            <svg class="svg-highlight-layer" *ngIf="currentHighlight && currentHighlight.page === currentPage"
                 [attr.viewBox]="'0 0 ' + viewportWidth + ' ' + viewportHeight"
                 [style.width.px]="viewportWidth" [style.height.px]="viewportHeight">
                <polygon [attr.points]="currentHighlight.points" class="glow-polygon" />
            </svg>
        </div>

        <div class="loading-spinner" *ngIf="isLoading">
            <div class="ring"></div>
            <span>Loading Document Canvas...</span>
        </div>
    </div>
</div>
